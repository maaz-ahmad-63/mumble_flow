services:
  - type: web
    name: whisperflow
    runtime: node
    # Disks need a paid instance. 0.5c-512mb is the smallest paid plan.
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    disk:
      name: whisperflow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3050
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_STT_PROVIDER
        value: groq
      - key: DEFAULT_LLM_PROVIDER
        value: groq
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
