name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (.dmg, .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Desktop Dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Build macOS Binaries
        working-directory: desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            desktop/electron/dist/*.dmg
            desktop/electron/dist/*.zip
          retention-days: 2

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Desktop Dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Build Windows Binaries
        working-directory: desktop/electron
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            desktop/electron/dist/*.exe
          retention-days: 2

  publish:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: release-assets

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Mumble AI Desktop ${{ steps.get_tag.outputs.tag }}
          body: |
            ## Mumble AI Voice Dictation & Intelligence Platform

            ### Desktop Downloads:
            - **macOS (Apple Silicon & Intel):** Download the `.dmg` or `.zip` below
            - **Windows (x64):** Download the `.exe` installer or portable `.exe` below

            ### Highlights:
            - Global hotkey dictation (Hold Space or press F8)
            - 15 specialized styles: Developer, Code, Terminal, Commit, SQL, Meeting Notes, Social/Comments, Prompt, Translator, and more
            - Zero-latency voice-to-text with auto-punctuation, filler word removal, and surgical self-correction
            - In-app automatic updates via GitHub Releases
          files: |
            release-assets/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

